name: Build official llama.cpp Android APK

on:
  workflow_dispatch:
    inputs:
      llama_ref:
        description: 'llama.cpp tag or commit (b11960 = llama.cpp v0.8.0)'
        required: true
        default: b11960
        type: string

permissions:
  contents: read

jobs:
  android-apk:
    name: Official llama.android - Android Debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout upstream llama.cpp
        uses: actions/checkout@v7
        with:
          repository: ggml-org/llama.cpp
          ref: ${{ inputs.llama_ref }}
          fetch-depth: 1
          path: llama.cpp

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Print exact upstream revision
        shell: bash
        run: |
          git -C llama.cpp rev-parse HEAD | tee SOURCE_REVISION.txt
          git -C llama.cpp describe --tags --always >> SOURCE_REVISION.txt
          cat SOURCE_REVISION.txt

      - name: Compile official Android example (CPU)
        shell: bash
        working-directory: llama.cpp/examples/llama.android
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Verify output and record checksum
        shell: bash
        run: |
          set -euo pipefail
          APK=llama.cpp/examples/llama.android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" | tail -1
          if ! unzip -Z1 "$APK" | grep '^lib/arm64-v8a/.*\.so$' > /dev/null; then
            echo 'No arm64-v8a native libraries found' >&2
            exit 1
          fi
          (cd "$(dirname "$APK")" && sha256sum "$(basename "$APK")") > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: llama-android-b11960-official-debug
          path: |
            llama.cpp/examples/llama.android/app/build/outputs/apk/debug/app-debug.apk
            SOURCE_REVISION.txt
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
